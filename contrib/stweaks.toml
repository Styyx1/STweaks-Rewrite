# ==========================================
# STweaks Configuration File
# Default Path: Data/SKSE/Plugins/stweaks.toml
# ==========================================

[DebugLogging]
bDebugLoggingEnable = false


# ==========================================
# SETTINGS — NUMERIC VALUES
# ==========================================
[SettingValues]

# Sneak / Movement
fSneakJumpModifier = 0.55

# Weapon & Magic Ranges
iUpperRangeWeapons = 15
iLowerRangeWeapons = 15
iUpperRangeMagic = 15
iLowerRangeMagic = 15

# Combat Costs / Scaling
fBaseStaminaCostMelee = 20.0
fMagicStamCostDivider = 2.0

# Casting Speed
fMaxCastSpeedModifier = 3.0
fMinCastSpeedModifier = 0.50

# Resistances
fResistReduceValue = 20.0

# Misc Gameplay Flow
fCurseChance = 1.0
fCurseSwapCooldown = 60.0

# Regen/Base Attributes
fStaminaBaseValue = 150.0
fMagickaBaseValue = 150.0


# ==========================================
# TOGGLES — FEATURE ENABLE/DISABLE
# ==========================================
[Toggles]

# Core Combat Logic
bEnableDamageRanges = true
bEnableDamageCaps = true
bEnableOneHitProtection = true

# Stamina / Magicka Systems
bEnableCastStamina = true
bEnableAttackStamina = true
bChangeStaminaRegen = true
bChangeMagickaRegen = true
bEnableSneakStamina = true
bEnableJumpStaminaCost = true

# Sneak, Movement, Visibility
bEnableSneakJumpLimit = true
bEnableTallGrassEnhancesSneak = true

# Actor Behavior / Gameplay
bEnableFadingActors = true
bEnableCurses = true
bEnableMassChangesWithEquipment = true
bMassBasedJump = true

# Magic & Perks
bEnableSkillBasedCastSpeed = true
bInteruptCastOnHit = true

# Quest / Item / Progression
bEnableQuestItemNerf = true
bAllowCurseSwaps = true
bLevelUpLowLevelEnemies = true
bEnableAutoAttributes = true
bEnableFollowerDamageChange = true

# Creature / Special Effects
bEnableEtherealChange = true

